site_name: TheGrind
site_description: "Coding interview preparation: algorithm solutions in seven languages, lessons, SQL, practical exercises and low-level design"
site_url: https://mhs-20.github.io/TheGrind/
repo_url: https://github.com/MHS-20/TheGrind
docs_dir: site_src

theme:
  name: sorrow

markdown_extensions:
  - tables
  - toc
  - pymdownx.highlight:
      use_pygments: false
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - gen-files:
      scripts:
        - site_src/gen_pages.py
  - literate-nav:
      nav_file: SUMMARY.md

extra_css:
  - extra.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js
  - mermaid-init.js

exclude_docs: |
  gen_pages.py
